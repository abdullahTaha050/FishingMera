name: Mobile build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, simulator, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: Require EAS configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN repository secret" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "Missing EAS_PROJECT_ID repository variable" && exit 1)
          if [ "${{ inputs.profile }}" = "simulator" ] && [ "${{ inputs.platform }}" != "ios" ]; then
            echo "The simulator profile is iOS-only" && exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed binary
        working-directory: apps/mobile
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
