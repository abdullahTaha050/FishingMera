name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [production]
    paths: ["supabase/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase config push --project-ref "$PROJECT_ID"
      - run: supabase db push --dry-run
      - run: supabase db push
      - name: Configure Edge Function discovery budget
        run: |
          test -n "$OPENAI_API_KEY" || (echo "Missing OPENAI_API_KEY repository secret" && exit 1)
          supabase secrets set --project-ref "$PROJECT_ID" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            OPENAI_DISCOVERY_MODEL="gpt-5-mini" \
            DISCOVERY_DAILY_SEARCH_LIMIT="25" \
            DISCOVERY_MONTHLY_USD_LIMIT="10"
      - run: supabase functions deploy api --project-ref "$PROJECT_ID"
      - name: Hosted backend smoke test
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run test:integration:backend
